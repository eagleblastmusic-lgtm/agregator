name: P10 OfertyPracy.edu Diagnostic

on:
  pull_request:
    branches:
      - feat/m0-employer-discovery-core
    paths:
      - ".github/workflows/p10-ofertypracyedu-diagnostic.yml"
      - "src/agregator/sources/ofertypracy_edu.py"
      - ".github/p10-smoke-trigger.txt"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Probe regional public Inertia searches
        shell: bash
        run: |
          mkdir -p p10-ofertypracyedu-diagnostic
          python - <<'PY'
          import asyncio
          import html as html_module
          import json
          import urllib.robotparser
          from pathlib import Path

          import httpx
          from bs4 import BeautifulSoup

          BASE = "https://ofertypracy.edu.pl"
          UA = "FaroEmployerDiscovery/0.2"
          root = Path("p10-ofertypracyedu-diagnostic")

          def parse_inertia(text: str):
              soup = BeautifulSoup(text, "html.parser")
              app = soup.select_one("#app[data-page]")
              if app is None:
                  return None
              raw = str(app.get("data-page") or "")
              return json.loads(html_module.unescape(raw)) if raw else None

          def summarize(payload):
              props = (payload or {}).get("props") or {}
              offers = props.get("offers") or {}
              data = offers.get("data") or []
              meta = offers.get("meta") or {}
              return {
                  "component": (payload or {}).get("component"),
                  "payload_url": (payload or {}).get("url"),
                  "filter": props.get("filter"),
                  "sort": props.get("sort"),
                  "perPage": props.get("perPage"),
                  "count": len(data),
                  "total": meta.get("total"),
                  "current_page": meta.get("current_page"),
                  "last_page": meta.get("last_page"),
                  "meta_per_page": meta.get("per_page"),
                  "first_offers": data[:3],
              }

          async def main():
              async with httpx.AsyncClient(
                  timeout=25,
                  follow_redirects=True,
                  headers={
                      "Accept": "text/html,application/xhtml+xml",
                      "Accept-Language": "pl-PL,pl;q=0.9",
                      "User-Agent": UA,
                  },
              ) as client:
                  robots_url = BASE + "/robots.txt"
                  robots_response = await client.get(robots_url)
                  parser = urllib.robotparser.RobotFileParser()
                  parser.set_url(robots_url)
                  if robots_response.status_code in {401, 403}:
                      parser.parse(["User-agent: *", "Disallow: /"])
                  elif robots_response.status_code == 404:
                      parser.parse(["User-agent: *", "Allow: /"])
                  else:
                      robots_response.raise_for_status()
                      parser.parse(robots_response.text.splitlines())

                  home = await client.get(BASE + "/")
                  home.raise_for_status()
                  home_payload = parse_inertia(home.text)
                  home_props = (home_payload or {}).get("props") or {}
                  voivodeships = home_props.get("voivodeships") or []

                  rows = []
                  for voivodeship in voivodeships:
                      region_id = str(voivodeship.get("id") or "").strip()
                      region_name = str(voivodeship.get("name") or "").strip()
                      if not region_id:
                          continue
                      params = {
                          "filter[rspo.voivodeship_id]": region_id,
                          "sort": "-published_at",
                          "per_page": "25",
                          "search": "1",
                      }
                      request = client.build_request("GET", BASE + "/", params=params)
                      url = str(request.url)
                      if not parser.can_fetch(UA, url):
                          rows.append(
                              {
                                  "id": region_id,
                                  "name": region_name,
                                  "robots_allowed": False,
                                  "url": url,
                              }
                          )
                          continue
                      response = await client.send(request)
                      response.raise_for_status()
                      payload = parse_inertia(response.text)
                      row = {
                          "id": region_id,
                          "name": region_name,
                          "robots_allowed": True,
                          "status": response.status_code,
                          "url": str(response.url),
                      }
                      row.update(summarize(payload))
                      rows.append(row)

                  output = {
                      "robots_status": robots_response.status_code,
                      "home": summarize(home_payload),
                      "voivodeships": voivodeships,
                      "regions": rows,
                      "regions_with_offers": [
                          row
                          for row in rows
                          if int(row.get("total") or 0) > 0
                      ],
                      "offers_total_sum": sum(
                          int(row.get("total") or 0) for row in rows
                      ),
                  }
                  root.joinpath("regions.json").write_text(
                      json.dumps(output, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )

          asyncio.run(main())
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p10-ofertypracyedu-diagnostic-${{ github.run_id }}
          path: p10-ofertypracyedu-diagnostic/
          retention-days: 3
