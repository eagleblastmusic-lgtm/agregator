name: Collection Smoke

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated collection sources"
        required: true
        default: "jooble,adzuna"
        type: string
      target_jobs:
        description: "Small collection target"
        required: true
        default: "100"
        type: string
      max_rounds:
        description: "Maximum round-robin collection rounds"
        required: true
        default: "10"
        type: string
      allow_experimental_sources:
        description: "Explicitly allow adapters marked experimental"
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - feat/m0-employer-discovery-core
    paths:
      - ".github/workflows/collection-smoke.yml"
      - ".github/p10-smoke-trigger.txt"

permissions:
  contents: read

concurrency:
  group: faro-collection-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      JOOBLE_KEYWORDS: praca
      JOOBLE_LOCATION: Polska
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      ADZUNA_COUNTRY: pl
      CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
      CAREERJET_REFERER: ${{ secrets.CAREERJET_REFERER }}
      CAREERJET_USER_IP: ${{ secrets.CAREERJET_USER_IP }}
      CAREERJET_USER_AGENT: ${{ secrets.CAREERJET_USER_AGENT }}
      EPRACA_PARTNER: ${{ secrets.EPRACA_PARTNER }}
      EPRACA_WOJEWODZTWO: ${{ vars.EPRACA_WOJEWODZTWO }}
      EPRACA_JEDNOSTKA: ${{ vars.EPRACA_JEDNOSTKA }}
      EPRACA_ALL: ${{ vars.EPRACA_ALL }}
      AGREGATOR_USER_AGENT: FaroEmployerDiscoveryCollectionSmoke/0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Initialize smoke workspace
        shell: bash
        run: |
          mkdir -p benchmark/collection-smoke
          echo "99" > benchmark/collection-smoke/preflight_exit_code.txt
          echo "99" > benchmark/collection-smoke/exit_code.txt

      - name: Collection preflight
        id: preflight
        shell: bash
        run: |
          set +e
          sources="${{ inputs.sources }}"
          [[ -n "$sources" ]] || sources="jooble,adzuna,careerjet,epraca"
          allow_experimental="${{ inputs.allow_experimental_sources }}"
          extra_args=()
          if [ "$allow_experimental" = "true" ]; then
            extra_args+=(--allow-experimental-sources)
          fi
          agregator-collect preflight \
            --sources "$sources" \
            "${extra_args[@]}" \
            --strict \
            > benchmark/collection-smoke/preflight.json
          code=$?
          echo "$code" > benchmark/collection-smoke/preflight_exit_code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run collection smoke
        if: steps.preflight.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          sources="${{ inputs.sources }}"
          target_jobs="${{ inputs.target_jobs }}"
          max_rounds="${{ inputs.max_rounds }}"
          allow_experimental="${{ inputs.allow_experimental_sources }}"
          [[ -n "$sources" ]] || sources="jooble,adzuna,careerjet,epraca"
          [[ -n "$target_jobs" ]] || target_jobs="20"
          [[ -n "$max_rounds" ]] || max_rounds="1"
          extra_args=()
          if [ "$allow_experimental" = "true" ]; then
            extra_args+=(--allow-experimental-sources)
          fi
          agregator-collect run \
            --db benchmark/collection-smoke/collection.sqlite3 \
            --output-dir benchmark/collection-smoke/run \
            --sources "$sources" \
            --target-jobs "$target_jobs" \
            --max-rounds "$max_rounds" \
            "${extra_args[@]}" \
            --strict \
            > benchmark/collection-smoke/run_result.json
          code=$?
          echo "$code" > benchmark/collection-smoke/exit_code.txt
          exit 0

      - name: Record skip after failed preflight
        if: steps.preflight.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Collection smoke skipped because preflight failed." \
            > benchmark/collection-smoke/run_skipped.txt

      - name: Write collection summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("benchmark/collection-smoke")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def load(name):
              path = root / name
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  return None

          preflight = load("preflight.json")
          result = load("run_result.json")

          lines = ["## Faro collection smoke", ""]
          if preflight is not None:
              lines.extend([
                  f"- Preflight ready: `{preflight.get('ready')}`",
                  f"- Search provider required: `{preflight.get('search_provider_required')}`",
              ])
              blockers = preflight.get("blockers") or []
              if blockers:
                  lines.append("- Preflight blockers: `" + ", ".join(map(str, blockers)) + "`")
                  if all(str(item).startswith("source_not_ready:") for item in blockers):
                      lines.append("- P10 state: `not_configured` (partner credentials unavailable)")

          if result is not None:
              collection = result.get("collection") or {}
              lines.extend([
                  f"- Target reached: `{collection.get('target_reached')}`",
                  f"- Source health ready: `{collection.get('source_health_ready')}`",
                  f"- Jobs after: `{collection.get('jobs_after')}`",
                  f"- Rounds: `{collection.get('rounds')}`",
                  f"- Ready for full enrichment benchmark: `{result.get('ready_for_full_enrichment_benchmark')}`",
                  "",
                  "### Sources",
                  "",
                  "| Source | Runs | Jobs seen | Inserted | Errors | Disabled |",
                  "| --- | ---: | ---: | ---: | ---: | --- |",
              ])
              for source, stats in sorted((collection.get("sources") or {}).items()):
                  lines.append(
                      f"| {source} | {stats.get('runs', 0)} | {stats.get('jobs_seen', 0)} | "
                      f"{stats.get('jobs_inserted', 0)} | {stats.get('errors', 0)} | "
                      f"{stats.get('disabled', False)} |"
                  )

          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload collection smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-collection-smoke-${{ github.run_id }}
          path: benchmark/collection-smoke/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce smoke result
        if: always()
        shell: bash
        run: |
          preflight_code=99
          run_code=99
          if [ -f benchmark/collection-smoke/preflight_exit_code.txt ]; then
            preflight_code=$(cat benchmark/collection-smoke/preflight_exit_code.txt)
          fi
          if [ -f benchmark/collection-smoke/exit_code.txt ]; then
            run_code=$(cat benchmark/collection-smoke/exit_code.txt)
          fi

          if [ "$preflight_code" -ne 0 ]; then
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              only_not_ready="$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("benchmark/collection-smoke/preflight.json")
          value = False
          if path.exists():
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  blockers = payload.get("blockers") or []
                  value = bool(blockers) and all(
                      str(item).startswith("source_not_ready:") for item in blockers
                  )
              except Exception:
                  value = False
          print("true" if value else "false")
          PY
              )"
              if [[ "$only_not_ready" == "true" ]]; then
                echo "Partner sources are not configured; recorded as P10 not_configured."
                exit 0
              fi
            fi
            echo "Collection preflight failed (exit code: $preflight_code)."
            exit "$preflight_code"
          fi

          if [ "$run_code" -ne 0 ]; then
            echo "Collection smoke did not pass strict readiness (exit code: $run_code)."
            exit "$run_code"
          fi
