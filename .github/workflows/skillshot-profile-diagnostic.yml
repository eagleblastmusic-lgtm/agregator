name: Skillshot employer profile diagnostic

on:
  pull_request:
    branches:
      - feat/m0-employer-discovery-core
    paths:
      - ".github/workflows/skillshot-profile-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx beautifulsoup4
      - name: Inspect public profile website field markup
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import urllib.robotparser
          from urllib.parse import urlparse

          import httpx
          from bs4 import BeautifulSoup, Tag

          BASE = "https://www.skillshot.pl"
          UA = "FaroEmployerDiscovery/0.2"
          PROFILES = ["/users/36", "/users/2435", "/users/5417"]

          async def main():
              async with httpx.AsyncClient(
                  timeout=25,
                  follow_redirects=True,
                  headers={
                      "User-Agent": UA,
                      "Accept": "text/html,application/xhtml+xml",
                      "Accept-Language": "pl-PL,pl;q=0.9",
                  },
              ) as client:
                  robots = await client.get(BASE + "/robots.txt", headers={"Accept": "text/plain,*/*;q=0.1"})
                  rp = urllib.robotparser.RobotFileParser()
                  rp.set_url(BASE + "/robots.txt")
                  if robots.status_code in {401, 403}:
                      rp.parse(["User-agent: *", "Disallow: /"])
                  elif robots.status_code == 404:
                      rp.parse(["User-agent: *", "Allow: /"])
                  else:
                      robots.raise_for_status()
                      rp.parse(robots.text.splitlines())

                  for path in PROFILES:
                      url = BASE + path
                      print("PROFILE_ALLOWED", path, rp.can_fetch(UA, url))
                      if not rp.can_fetch(UA, url):
                          continue
                      response = await client.get(url)
                      print("PROFILE", path, response.status_code, len(response.text))
                      response.raise_for_status()
                      soup = BeautifulSoup(response.text, "html.parser")
                      for anchor in soup.select("a[href]"):
                          if not isinstance(anchor, Tag):
                              continue
                          href = str(anchor.get("href") or "")
                          parsed = urlparse(href)
                          host = (parsed.hostname or "").lower()
                          if not host or host.endswith("skillshot.pl"):
                              continue
                          parent = anchor.parent if isinstance(anchor.parent, Tag) else None
                          grand = parent.parent if parent is not None and isinstance(parent.parent, Tag) else None
                          print("EXTERNAL", {
                              "href": href,
                              "text": anchor.get_text(" ", strip=True),
                              "parent_name": parent.name if parent else None,
                              "parent_text": parent.get_text(" ", strip=True)[:220] if parent else None,
                              "parent_html": str(parent)[:500] if parent else None,
                              "grand_name": grand.name if grand else None,
                              "grand_text": grand.get_text(" ", strip=True)[:300] if grand else None,
                          })

          asyncio.run(main())
          PY
