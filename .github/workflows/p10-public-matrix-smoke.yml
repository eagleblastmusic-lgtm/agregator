name: P10 Public Matrix Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/m0-employer-discovery-core
    paths:
      - ".github/workflows/p10-public-matrix-smoke.yml"
      - ".github/p10-smoke-trigger.txt"

permissions:
  contents: read

concurrency:
  group: faro-p10-public-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke / ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        source:
          - aplikuj
          - bulldogjob
          - justjoinit
          - karierawfinansach
          - kprm
          - manpower
          - nofluffjobs
          - ngo
          - ofertypracyedu
          - olx
          - pracuj
          - randstad
          - rocketjobs
          - skillshot
          - theprotocol

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Prepare workspace
        shell: bash
        run: |
          mkdir -p "p10-public/${{ matrix.source }}"
          echo "99" > "p10-public/${{ matrix.source }}/exit_code.txt"

      - name: Run source smoke
        id: scrape
        continue-on-error: true
        shell: bash
        run: |
          set +e
          root="p10-public/${{ matrix.source }}"
          agregator-scrape run \
            --sources "${{ matrix.source }}" \
            --pages-per-source 1 \
            --db "$root/smoke.sqlite3" \
            --fresh \
            --strict \
            | tee "$root/result.json"
          code=${PIPESTATUS[0]}
          echo "$code" > "$root/exit_code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build source validation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          root="p10-public/${{ matrix.source }}"
          agregator-validate report \
            --db "$root/smoke.sqlite3" \
            --output "$root/validation.json" \
            --markdown "$root/validation.md"

      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-p10-public-${{ matrix.source }}-${{ github.run_id }}
          path: p10-public/
          retention-days: 7

      - name: Enforce source result
        if: always()
        shell: bash
        run: |
          code="$(cat "p10-public/${{ matrix.source }}/exit_code.txt" 2>/dev/null || echo 1)"
          if [[ "$code" != "0" ]]; then
            echo "${{ matrix.source }} smoke failed with exit code $code"
            exit "$code"
          fi

  aggregate:
    name: aggregate P10 public smoke
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: faro-p10-public-*-${{ github.run_id }}
          path: aggregate
          merge-multiple: true

      - name: Build aggregate summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("aggregate")
          rows = []
          for result_path in sorted(root.glob("*/result.json")):
              source = result_path.parent.name
              try:
                  payload = json.loads(result_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  rows.append({"source": source, "status": "invalid_result", "error": str(exc)})
                  continue
              item = (payload.get("results") or [{}])[0]
              rows.append(
                  {
                      "source": source,
                      "status": item.get("status", "unknown"),
                      "jobs_seen": item.get("jobs_seen", 0),
                      "jobs_inserted": item.get("jobs_inserted", 0),
                      "companies_created": item.get("companies_created", 0),
                      "error": item.get("error", ""),
                  }
              )

          payload = {
              "sources": rows,
              "successful": [row["source"] for row in rows if row["status"] == "success"],
              "failed": [row["source"] for row in rows if row["status"] != "success"],
          }
          Path("p10-public-summary.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          lines = [
              "## P10 public source matrix smoke",
              "",
              f"- Successful: `{len(payload['successful'])}`",
              f"- Failed: `{len(payload['failed'])}`",
              "",
              "| Source | Status | Seen | Inserted | Companies | Error |",
              "|---|---|---:|---:|---:|---|",
          ]
          for row in rows:
              error = str(row.get("error", "")).replace("|", "\\|").replace("\n", " ")
              lines.append(
                  f"| {row['source']} | {row['status']} | {row.get('jobs_seen', 0)} | "
                  f"{row.get('jobs_inserted', 0)} | {row.get('companies_created', 0)} | {error} |"
              )
          summary = "\n".join(lines) + "\n"
          Path("p10-public-summary.md").write_text(summary, encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          PY

      - name: Upload aggregate summary
        uses: actions/upload-artifact@v4
        with:
          name: faro-p10-public-summary-${{ github.run_id }}
          path: |
            p10-public-summary.json
            p10-public-summary.md
          retention-days: 7
