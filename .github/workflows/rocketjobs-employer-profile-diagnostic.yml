name: RocketJobs employer profile diagnostic

on:
  pull_request:
    branches:
      - feat/m0-employer-discovery-core
    paths:
      - ".github/workflows/rocketjobs-employer-profile-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx beautifulsoup4
      - name: Inspect public offer-to-profile and profile website fields
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import json
          import re
          import urllib.robotparser
          from urllib.parse import urljoin, urlparse

          import httpx
          from bs4 import BeautifulSoup, Tag

          BASE = "https://rocketjobs.pl"
          UA = "FaroEmployerDiscovery/0.2"
          LISTING = BASE + "/"
          OFFER_RE = re.compile(r"^/oferta-pracy/")
          PROFILE_RE = re.compile(r"^/brands/story/")
          INTERNAL_ROOTS = ("rocketjobs.pl", "justjoin.it", "rocketjobs.com")

          def root_host(host):
              host = (host or "").lower().rstrip(".")
              return any(host == root or host.endswith("." + root) for root in INTERNAL_ROOTS)

          async def main():
              async with httpx.AsyncClient(
                  timeout=25,
                  follow_redirects=True,
                  headers={
                      "User-Agent": UA,
                      "Accept": "text/html,application/xhtml+xml",
                      "Accept-Language": "pl-PL,pl;q=0.9",
                  },
              ) as client:
                  robots_url = BASE + "/robots.txt"
                  robots = await client.get(robots_url, headers={"Accept": "text/plain,*/*;q=0.1"})
                  print("ROBOTS", robots.status_code, len(robots.text))
                  rp = urllib.robotparser.RobotFileParser()
                  rp.set_url(robots_url)
                  if robots.status_code in {401, 403}:
                      rp.parse(["User-agent: *", "Disallow: /"])
                  elif robots.status_code == 404:
                      rp.parse(["User-agent: *", "Allow: /"])
                  else:
                      robots.raise_for_status()
                      rp.parse(robots.text.splitlines())

                  print("LISTING_ALLOWED", rp.can_fetch(UA, LISTING))
                  listing = await client.get(LISTING)
                  print("LISTING", listing.status_code, len(listing.text))
                  listing.raise_for_status()
                  soup = BeautifulSoup(listing.text, "html.parser")
                  offers = []
                  for a in soup.select("a[href]"):
                      href = str(a.get("href") or "").strip()
                      absolute = urljoin(BASE, href)
                      parsed = urlparse(absolute)
                      if (parsed.hostname or "").lower().endswith("rocketjobs.pl") and OFFER_RE.match(parsed.path):
                          clean = parsed._replace(query="", fragment="").geturl()
                          if clean not in offers:
                              offers.append(clean)
                      if len(offers) >= 8:
                          break
                  print("OFFERS", len(offers), offers)

                  profiles = []
                  for offer in offers:
                      print("OFFER_ALLOWED", rp.can_fetch(UA, offer), offer)
                      if not rp.can_fetch(UA, offer):
                          continue
                      response = await client.get(offer)
                      print("OFFER", response.status_code, len(response.text), offer)
                      if response.status_code != 200:
                          continue
                      page = BeautifulSoup(response.text, "html.parser")
                      matches = []
                      for a in page.select("a[href]"):
                          href = str(a.get("href") or "").strip()
                          absolute = urljoin(offer, href)
                          parsed = urlparse(absolute)
                          if (parsed.hostname or "").lower().endswith("rocketjobs.pl") and PROFILE_RE.match(parsed.path):
                              clean = parsed._replace(query="", fragment="").geturl()
                              item = (clean, a.get_text(" ", strip=True)[:120])
                              if item not in matches:
                                  matches.append(item)
                              if clean not in profiles:
                                  profiles.append(clean)
                      print("PROFILE_LINKS", matches[:10])

                  print("PROFILES", len(profiles), profiles[:8])
                  for profile in profiles[:6]:
                      print("PROFILE_ALLOWED", rp.can_fetch(UA, profile), profile)
                      if not rp.can_fetch(UA, profile):
                          continue
                      response = await client.get(profile)
                      print("PROFILE", response.status_code, len(response.text), profile)
                      if response.status_code != 200:
                          continue
                      page = BeautifulSoup(response.text, "html.parser")

                      external = []
                      for a in page.select("a[href]"):
                          if not isinstance(a, Tag):
                              continue
                          href = str(a.get("href") or "").strip()
                          absolute = urljoin(profile, href)
                          parsed = urlparse(absolute)
                          host = (parsed.hostname or "").lower()
                          if parsed.scheme not in {"http", "https"} or not host or root_host(host):
                              continue
                          parent = a.find_parent(("p", "li", "div", "section"))
                          external.append({
                              "href": absolute,
                              "text": a.get_text(" ", strip=True)[:140],
                              "parent": parent.get_text(" ", strip=True)[:280] if isinstance(parent, Tag) else None,
                          })
                      print("EXTERNAL", external[:30])

                      structured = []
                      for script in page.find_all("script"):
                          raw = script.string or script.get_text()
                          if not raw or len(raw) > 5_000_000:
                              continue
                          script_type = str(script.get("type") or "")
                          script_id = str(script.get("id") or "")
                          if script_type == "application/ld+json" or script_id == "__NEXT_DATA__":
                              try:
                                  payload = json.loads(raw)
                              except Exception:
                                  continue
                              hits = []
                              stack = [([], payload)]
                              while stack:
                                  path, current = stack.pop()
                                  if isinstance(current, dict):
                                      for key, value in current.items():
                                          key_l = str(key).lower()
                                          next_path = path + [str(key)]
                                          if key_l in {"website", "websiteurl", "companywebsite", "externalurl", "url", "sameas", "slug", "name"}:
                                              if isinstance(value, (str, int, float, bool)) or value is None:
                                                  hits.append((".".join(next_path[-8:]), value))
                                          if len(path) < 30:
                                              stack.append((next_path, value))
                                  elif isinstance(current, list) and len(path) < 30:
                                      for idx, value in enumerate(current[:500]):
                                          stack.append((path + [str(idx)], value))
                              structured.append({"type": script_type, "id": script_id, "hits": hits[:160]})
                      print("STRUCTURED", structured[:10])

                      html_lower = response.text.lower()
                      for needle in ("website", "companywebsite", "websiteurl", "externalurl"):
                          positions = [m.start() for m in re.finditer(needle, html_lower)][:8]
                          snippets = [response.text[max(0, p-180):p+420].replace("\n", " ") for p in positions]
                          print("NEEDLE", needle, snippets)

          asyncio.run(main())
          PY
