name: Ruff import diagnostic

on:
  pull_request:
    branches:
      - feat/m0-employer-discovery-core
    paths:
      - ".github/workflows/ruff-import-diff.yml"
      - "src/agregator/sources/public_sources.py"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.7
      - name: Show exact Ruff import fix
        run: ruff check --select I001 --diff src/agregator/sources/public_sources.py
